<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sprzedaż</title>
  <link rel="manifest" href="/sprzedaz/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg">
  <meta name="theme-color" content="#1d3557">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sprzedaż">
  <link rel="stylesheet" href="sprzedaz.css">
</head>
<!-- Analiza sprzedaży na telefon (docs/analiza-sprzedazy.md): podsumowanie dnia/zakresu vs ten sam dzień tygodnia
     rok temu, kanały i swipe kart produktów. Dostęp przez Tailscale, tylko admin (wymusza backend, /api/analiza). -->
<body>
  <header class="t-gora">
    <div class="r1">
      <div class="tytul"><h1>Sprzedaż</h1><div id="wms-badge-slot"></div></div>
      <span class="dzien"><button id="d-wstecz" aria-label="poprzedni dzień">‹</button><span id="d-data"></span><button id="d-dalej" aria-label="następny dzień">›</button></span>
      <span class="dzien hidden" id="z-data"></span>
    </div>
    <div class="seg" id="seg-zakres"></div>
  </header>
  <main>
    <div class="t-blok komunikat hidden" id="komunikat"></div>
    <div id="przeglad">
    <div class="t-blok t-hero" id="hero"><div class="sw-brak">Ładuję…</div></div>
    <div class="t-blok ostrz hidden" id="ostrz"></div>
    <div class="t-blok"><div class="t-kan" id="kanaly"></div></div>
    <div class="t-sekcja"><h2 id="prod-tyt">Produkty</h2><span class="seg maly" id="seg-sort"></span></div>
    <div class="karty" id="karty"></div>
    <div class="t-nav"><button id="k-wstecz" aria-label="poprzedni produkt">‹</button><span id="k-licznik"></span><button id="k-dalej" aria-label="następny produkt">›</button></div>
    <div class="dol"><span class="seg" id="seg-baza"></span><div class="sw-brak" id="stopka"></div></div>
    </div>
    <!-- „Zmiany”: co rośnie, co spada, co zgasło — dni zamknięte, 7 / 30 dni, te same filtry co Sprzedaż → Trendy
         na desktopie (public/shared/trendy-model.js). Bez limitu pozycji; karty dorysowują się partiami. -->
    <div id="zmiany" class="hidden">
      <div class="t-blok">
        <div class="z-ster"><span class="seg" id="z-okno"></span><span class="seg" id="z-por"></span></div>
        <div class="z-opis" id="z-opis"></div>
        <div class="z-chipy" id="z-chipy"></div>
        <div class="z-suma" id="z-suma"></div>
      </div>
      <div class="karty" id="z-karty"></div>
      <div class="t-nav"><button id="z-wstecz" aria-label="poprzedni produkt">‹</button><span id="z-licznik"></span><button id="z-dalej" aria-label="następny produkt">›</button></div>
      <div class="dol"><div class="sw-brak" id="z-stopka"></div></div>
    </div>
    <!-- „Live”: ostatnie zamówienia po kolei, najnowsze na górze — bez grupowania po produkcie (GET /api/analiza/live).
         Przewijana lista, starsze dociągają się same; najnowsze odświeżają się co minutę, gdy widok jest otwarty. -->
    <div id="live" class="hidden">
      <div class="t-blok l-opis-blok"><div class="z-opis" id="l-opis"></div></div>
      <div id="l-lista"></div>
      <div class="dol"><button class="l-wiecej hidden" id="l-wiecej">Starsze zamówienia</button><div class="sw-brak" id="l-stopka"></div></div>
    </div>
  </main>
  <div class="podglad hidden" id="podglad"><img alt=""></div>
  <script src="/shared/auth.js"></script>
  <script src="/shared/sprzedaz-wspolne.js"></script>
  <script src="/shared/trendy-model.js"></script>
  <script src="sprzedaz.js"></script>
</body>
</html>
